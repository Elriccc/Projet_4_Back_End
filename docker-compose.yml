services:

  app:
    image: "workshop-organizer:${WORKSHOP_ORGANIZER_VERSION}"
    ports:
      - "${WORKSHOP_ORGANIZER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:${WORKSHOP_ORGANIZER_PORT}/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app_network
      - internal_network

  db:
    image: postgres:${POSTGRES_VERSION}
    ports:
      - ${POSTGRES_PORT}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_network

networks:
  app_network:
  internal_network:
    internal: true

volumes:
  db_data: